name: Collect authorized market data

on:
  schedule:
    # 03:17 and 15:17 in Nigeria (UTC+1); offset from the busiest hour.
    - cron: "17 2,14 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: marketpulse-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      MARKETPULSE_FACEBOOK_ACCESS_TOKEN: ${{ secrets.MARKETPULSE_FACEBOOK_ACCESS_TOKEN }}
      MARKETPULSE_JIJI_PLAYWRIGHT: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Check database secret
        shell: bash
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "Add the DATABASE_URL repository secret before running collection."
            exit 1
          fi
      - name: Install backend and browser dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Apply database migrations
        run: python -m alembic upgrade head
      - name: Collect due sources once
        run: python -m app.worker --once
